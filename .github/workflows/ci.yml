name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux — build (warnings as errors) + test
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Build with warnings as errors
        # A warning fails the job, so the README's "zero warnings" claim is
        # machine-enforced rather than asserted in prose.
        run: swift build -Xswiftc -warnings-as-errors
      - name: Test
        run: swift test

  apple:
    name: macOS — build for iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve package
        run: xcodebuild -resolvePackageDependencies
      - name: Build for iOS Simulator
        # Generic destination on purpose: pinning to a named device ties the job
        # to whichever simulator runtimes happen to be installed on that day's
        # runner image, and they are not guaranteed. A compile-only check needs
        # no device to exist.
        #
        # The scheme is read from xcodebuild rather than hardcoded: SwiftPM's
        # generated scheme name is a build-system detail, not package API.
        #
        # EVERY scheme is built, not just the first one. Building only the first
        # scheme silently skipped IntentAuthorityUI — the SwiftUI module, and the
        # only part of this package that Linux cannot compile at all, since it is
        # behind `#if canImport(SwiftUI)`. A type error there shipped in 1.1.0
        # with both CI jobs green. This loop is the fix for that class of miss.
        #
        # The loop is guarded, because a `while read` over an empty pipeline
        # exits 0 and would reproduce the exact green-on-nothing failure this
        # step exists to fix. `IntentAuthorityUI` must appear in the scheme list
        # or the job fails before building anything, and the counter must be
        # non-zero at the end.
        #
        # `< /dev/null` on the build: xcodebuild inherits the loop's stdin
        # otherwise and can eat the remaining scheme names.
        run: |
          set -euo pipefail
          xcodebuild -list
          SCHEMES=$(xcodebuild -list | sed -n '/Schemes:/,$p' | tail -n +2 | sed '/^$/d' | xargs -n1)
          echo "Discovered schemes: $SCHEMES"
          echo "$SCHEMES" | grep -qx 'IntentAuthorityUI' \
            || { echo "::error::IntentAuthorityUI is not in the scheme list — the SwiftUI module would go unbuilt"; exit 1; }
          BUILT=0
          for SCHEME in $SCHEMES; do
            echo "::group::Building scheme $SCHEME"
            xcodebuild build -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' < /dev/null
            echo "::endgroup::"
            BUILT=$((BUILT + 1))
          done
          echo "Built $BUILT scheme(s)."
          [ "$BUILT" -gt 0 ] || { echo "::error::built nothing"; exit 1; }
